name: CI
on:
  pull_request:
  push:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            java: 21
            distribution: temurin
            jobtype: 1
          - os: ubuntu-latest
            java: 17
            distribution: zulu
            jobtype: 2
          - os: ubuntu-latest
            java: 25
            distribution: zulu
            jobtype: 3
          - os: ubuntu-latest
            java: 25
            distribution: zulu
            jobtype: 4
          - os: ubuntu-latest
            java: 25
            distribution: zulu
            jobtype: 5
          # - os: ubuntu-latest
          #   java: 8
          #   distribution: zulu
          #   jobtype: 6
          - os: ubuntu-latest
            java: 25
            distribution: zulu
            jobtype: 7
          - os: ubuntu-latest
            java: 17
            distribution: temurin
            jobtype: 10
          - os: ubuntu-latest
            java: 17
            distribution: temurin
            jobtype: 11
          - os: windows-latest
            java: 17
            distribution: temurin
            jobtype: 10
          - os: windows-latest
            java: 17
            distribution: zulu
            jobtype: 12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      JAVA_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      UTIL_TESTS: "utilControl/test utilInterface/test utilLogging/test utilPosition/test utilRelation/test utilScripted/test"
      SBT_LOCAL: false
      TEST_SBT_VER: 1.5.0
      SBT_ETC_FILE: $HOME/etc/sbt/sbtopts
      JDK11: adopt@1.11.0-9
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - name: Don't convert LF to CRLF during checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout sbt/sbt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Checkout sbt/io
        uses: actions/checkout@v7
        with:
          repository: sbt/io
          ref: develop
          path: io
      - name: Checkout sbt/zinc
        uses: actions/checkout@v7
        with:
          repository: sbt/zinc
          ref: develop
          path: zinc
      - name: Cleanup SBT server and named pipes (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Kill sbt processes if any are running
          Get-Process sbt -ErrorAction SilentlyContinue | Stop-Process -Force
          # Remove all SBT named pipes, suppress errors if none exist
          Remove-Item "\\.\pipe\sbt-*" -ErrorAction SilentlyContinue
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "${{ matrix.distribution }}"
          java-version: "${{ matrix.java }}"
          cache: "sbt"
      - name: Block compromised eMudhra intermediate CAs
        shell: bash
        run: |
          cat >> "$JAVA_HOME/lib/security/blocked.certs" <<'EOF'
          42C4ACCD12C4F59597925E1A08A7A90102608543809308D50EC427E118BA1493
          45A883F349AEDFD5F3A649B5498FFB121712BA8B448F3F2A91DBC5A766FCDDBE
          98B896625C0C230ADEEC3EB2CF6AAD5001ECF9156A68644E82374CE5833BC25B
          5F1DED4DD590AF74631290CF073B122A2AAC6A1FA479778A0BD43579BD832699
          E7568FE6E12331F4FD7DE61DA4C7559D0F8EB192A218D4741A3BA75184333838
          579480AEA166290BD3C643589E795FC0D0E54E86505D180F1DFF99EFD3199512
          0164D7CEAE5BB909C272AF151FF44B1177AE9B47D9424B94F1D9558C30934D19
          62B7F9868263F72F6911FC78CEAF72C1979158B7368BF648683BB2AA39B02E72
          CB6E15165AC802E9B3F993F16C25D41F4E81C21EBDE71AE1B012AC00BF9C7C3F
          7485B51C0ED192878FA1D2F948FB529AE1842CC5086C4B67F7BE5B2039DE9489
          432EC25F0D28DE9006D97BF752F17BBB2CD41F669933FCB072D9A1148D0261F3
          FD9D5C2DBBD4995AB69B8D50C439D9527B00529199C2FD01B2174EB58F07021F
          9E39DE2881273ACC225A149C72BA3E0F51424963669AB633EE1DC7DF5DB067B4
          A496E23AC0CAB8155FC9B117B97EAE368EFCBB9041AEC8804D5A308D2D01C2D8
          4B2460A466F95FD40113BCDCCA2CEB29B3B093921DE45474DA7DF48874C630B1
          84112972B8E59D14560AE7E7119654474AAD119990CF3722BFC1E3B91615E1FD
          EOF
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
        with:
          disk-cache: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Pre-test cleanup
        shell: bash
        run: |
          rm -rf "$HOME/.sbt/scripted/" || true
          rm -rf "$HOME/.ivy2/local" || true
          find "$HOME/.sbt/boot" -name "*-SNAPSHOT" -exec rm -rf {} + 2>/dev/null || true
      - name: Publish local Zinc
        if: ${{ matrix.jobtype == 6 }}
        shell: bash
        run: |
          ./sbt -v lowerUtils/publishLocal
          cd zinc/
          sbt publishLocal
      - name: Build and test (1)
        if: ${{ matrix.jobtype == 1 }}
        shell: bash
        run: |
          rm -rf "$HOME/.sbt/boot/" || true
          ./sbt -v --server "mimaReportBinaryIssues;javafmtCheck;Test/javafmtCheck;scalafmtCheckRepo"
          # ./sbt -v --client headerCheck
          # ./sbt -v --client "Test/headerCheck"
          ./sbt -v --server "Test/compile;doc;publishLocal;test;serverTestProj/test;all $UTIL_TESTS"
      - name: Build and test (2)
        if: ${{ matrix.jobtype == 2 }}
        shell: bash
        run: |
          ./sbt -v "scripted actions/* apiinfo/* cache/* compiler-project/* ivy-deps-management/* reporter/* classloader-cache/* package/*"
          ./sbt -v "scripted watch/*"
      - name: Build and test (3)
        if: ${{ matrix.jobtype == 3 }}
        shell: bash
        run: |
          ./sbt -v --client "scripted dependency-graph/* dependency-management/* java/*"
      - name: Build and test (4)
        if: ${{ matrix.jobtype == 4 }}
        shell: bash
        run: |
          ./sbt -v "RepoOverrideTest/scripted force-proxy-repos-file/*"
          ./sbt -v "scripted source-dependencies/* nio/* plugins/*"
      - name: Build and test (5)
        if: ${{ matrix.jobtype == 5 }}
        shell: bash
        run: |
          ./sbt -v "scripted global-plugin/* project/*"
      # - name: Build and test (6)
      #  if: ${{ matrix.jobtype == 6 }}
      #  shell: bash
      #  run: |
      #    # build from fresh IO, LM, and Zinc
      #    BUILD_VERSION="1.5.0-SNAPSHOT"
      #    cd io
      #    sbt -v -Dsbt.build.version=${BUILD_VERSION} +publishLocal
      #    cd ../
      #    sbt -Dsbtzinc.path=$HOME/work/sbt/sbt/zinc -Dsbt.build.version=$BUILD_VERSION -Dsbt.build.fatal=false "+lowerUtils/publishLocal; {zinc}/publishLocal; upperModules/publishLocal"
      #    find "$HOME/.sbt/boot" -name "*-SNAPSHOT" -exec rm -rf {} + 2>/dev/null || true
      #    sbt -v -Dsbt.version=$BUILD_VERSION "++$SCALA_213; all $UTIL_TESTS; ++$SCALA_212; all $UTIL_TESTS; scripted actions/* source-dependencies/*1of3 dependency-management/*1of4 java/*"
      - name: Scripted (tests)
        if: ${{ matrix.jobtype == 7 }}
        shell: bash
        run: |
          ./sbt -v "scripted tests/* project-matrix/* project-load/* run/*"
      - name: Build and test lm-coursier (10)
        if: ${{ matrix.jobtype == 10 }}
        shell: bash
        run: scripts/lm-coursier-ci.sh
      - name: Build and test contraband
        if: ${{ matrix.jobtype == 11 }}
        shell: bash
        run: |
          find **/src/main/contraband-scala -name "*.scala" -delete || true
          sbt generateContrabands
          git diff --exit-code
      - name: Build and test (12)
        if: ${{ matrix.jobtype == 12 }}
        shell: bash
        run: |
          ./sbt -v --server "scripted cache/*"
