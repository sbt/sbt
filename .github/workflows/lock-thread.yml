name: 'Lock Threads'

on:
  schedule:
    # once a week on Saturday
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: lock-threads

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dessant/lock-threads@v6.0.2
        with:
          process-only: "issues"
