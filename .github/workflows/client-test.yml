name: Client Test
on:
  pull_request:
  push:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 17
            distribution: zulu
          - os: macos-latest
            java: 17
            distribution: temurin
          - os: windows-latest
            java: 17
            distribution: zulu
    runs-on: ${{ matrix.os }}
    env:
      JAVA_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      SBT_ETC_FILE: $HOME/etc/sbt/sbtopts
      TEST_SBT_VER: 1.11.4
    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: "zulu"
        java-version: |
          25
          17
        cache: sbt
    - name: Block compromised eMudhra intermediate CAs
      shell: bash
      run: |
        cat >> "$JAVA_HOME/lib/security/blocked.certs" <<'EOF'
        42C4ACCD12C4F59597925E1A08A7A90102608543809308D50EC427E118BA1493
        45A883F349AEDFD5F3A649B5498FFB121712BA8B448F3F2A91DBC5A766FCDDBE
        98B896625C0C230ADEEC3EB2CF6AAD5001ECF9156A68644E82374CE5833BC25B
        5F1DED4DD590AF74631290CF073B122A2AAC6A1FA479778A0BD43579BD832699
        E7568FE6E12331F4FD7DE61DA4C7559D0F8EB192A218D4741A3BA75184333838
        579480AEA166290BD3C643589E795FC0D0E54E86505D180F1DFF99EFD3199512
        0164D7CEAE5BB909C272AF151FF44B1177AE9B47D9424B94F1D9558C30934D19
        62B7F9868263F72F6911FC78CEAF72C1979158B7368BF648683BB2AA39B02E72
        CB6E15165AC802E9B3F993F16C25D41F4E81C21EBDE71AE1B012AC00BF9C7C3F
        7485B51C0ED192878FA1D2F948FB529AE1842CC5086C4B67F7BE5B2039DE9489
        432EC25F0D28DE9006D97BF752F17BBB2CD41F669933FCB072D9A1148D0261F3
        FD9D5C2DBBD4995AB69B8D50C439D9527B00529199C2FD01B2174EB58F07021F
        9E39DE2881273ACC225A149C72BA3E0F51424963669AB633EE1DC7DF5DB067B4
        A496E23AC0CAB8155FC9B117B97EAE368EFCBB9041AEC8804D5A308D2D01C2D8
        4B2460A466F95FD40113BCDCCA2CEB29B3B093921DE45474DA7DF48874C630B1
        84112972B8E59D14560AE7E7119654474AAD119990CF3722BFC1E3B91615E1FD
        EOF
    - uses: sbt/setup-sbt@v1
      with:
        disk-cache: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
    - name: Setup Windows C++ toolchain
      uses: ilammy/msvc-dev-cmd@v1
      if: ${{ matrix.os == 'windows-latest' }}
    - name: Client test (Linux)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        # test building sbtn on Linux (sbtw native-image dropped: scopt lazy vals break under Graal)
        sbt "-Dsbt.io.virtual=false" nativeImage
        # smoke test native Image
        ./target/out/jvm/u/sbt-client/bin/sbtn --sbt-script=$(pwd)/sbt about
        ./target/out/jvm/u/sbt-client/bin/sbtn --sbt-script=$(pwd)/sbt shutdown
        # test launcher script
        echo build using JDK 17 test using JDK 17 and JDK 25
        sbt --server -Dsbt.build.version=$TEST_SBT_VER launcherPackage/Rpm/packageBin launcherPackage/Debian/packageBin
        sbt -Dsbt.build.version=$TEST_SBT_VER launcherPackageIntegrationTest/test
        cd launcher-package/citest && ./test.sh
        JAVA_HOME="$JAVA_HOME_25_X64"
        PATH="$JAVA_HOME_25_X64/bin:$PATH"
        java -Xmx32m -version
        ./test.sh
    - name: Client test (macOS)
      if: ${{ matrix.os == 'macos-latest' }}
      shell: bash
      run: |
        # test building sbtn on macOS (sbtw native-image dropped: scopt lazy vals break under Graal)
        ./sbt "-Dsbt.io.virtual=false" nativeImage
        # test launcher script
        launcher-package/bin/coursier resolve
        sbt -Dsbt.build.version=$TEST_SBT_VER launcherPackageIntegrationTest/test
        # This fails due to the JLine issue
        # cd launcher-package/citest && ./test.sh
    - name: build image (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 10
        max_attempts: 3
        shell: bash
        command: |
          # test building sbtn on Windows (sbtw native-image dropped: scopt lazy vals break under Graal)
          sbt "-Dsbt.io.virtual=false" nativeImage
    - name: sbtn test (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: bash
      run: |
        REPO_ROOT=$(pwd)
        set -o xtrace
        # smoke test native Image (sbtn)
        $REPO_ROOT/target/out/jvm/u/sbt-client/bin/sbtn --sbt-script=$REPO_ROOT/launcher-package/src/universal/bin/sbt.bat about
        $REPO_ROOT/target/out/jvm/u/sbt-client/bin/sbtn --sbt-script=$REPO_ROOT/launcher-package/src/universal/bin/sbt.bat shutdown
        pushd launcher-package/citest
        # smoke test native Image (sbtn) against sbt 1.x build
        $REPO_ROOT/target/out/jvm/u/sbt-client/bin/sbtn --sbt-script=$REPO_ROOT/launcher-package/src/universal/bin/sbt.bat about > out.txt
        grep -q "Available Plugins" out.txt
        $REPO_ROOT/target/out/jvm/u/sbt-client/bin/sbtn --sbt-script=$REPO_ROOT/launcher-package/src/universal/bin/sbt.bat shutdown
        popd
    - name: Client test (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: bash
      run: |
        # test launcher script
        echo build using JDK 17 test using JDK 17 and JDK 25
        launcher-package/bin/coursier.bat resolve
        sbt -Dsbt.build.version=$TEST_SBT_VER launcherPackageIntegrationTest/test
        # integration tests with sbtw as drop-in for sbt.bat (JVM runner)
        sbt -Dsbt.build.version=$TEST_SBT_VER -Dsbt.test.useSbtw=true launcherPackageIntegrationTest/test
        cd launcher-package/citest
        ./test.bat
        test3/test3.bat
