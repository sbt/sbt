name: Publish to WinGet
on:
  release:
    types: [released]
jobs:
  publish:
    runs-on: windows-latest # action can only be run on windows
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: sbt.sbt
          fork-user: sbt-winget-dist-bot
          token: ${{ secrets.WINGET_TOKEN }}
